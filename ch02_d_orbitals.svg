<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260">
  <rect width="600" height="260" fill="#0c0f14"/>
  <text x="300" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a8899" letter-spacing="0.5">d-ORBITALS  ·  ℓ = 2  ·  5 degenerate orbitals  ·  max 10e⁻</text>

  <defs>
    <radialGradient id="da" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9070d0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9070d0" stop-opacity="0.06"/>
    </radialGradient>
    <radialGradient id="db" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <!-- dxy — cloverleaf between x and y axes -->
  <g transform="translate(60,135)">
    <ellipse cx="28" cy="-28" rx="30" ry="14" transform="rotate(45 28 -28)" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="-28" cy="28" rx="30" ry="14" transform="rotate(45 -28 28)" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="28" cy="28" rx="30" ry="14" transform="rotate(-45 28 28)" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <ellipse cx="-28" cy="-28" rx="30" ry="14" transform="rotate(-45 -28 -28)" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#252d3a" stroke-width="0.8"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#252d3a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#e8c060"/>
    <text x="0" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9070d0" font-style="italic">d</text>
    <text x="8" y="116" font-family="Georgia,serif" font-size="10" fill="#9070d0">xy</text>
    <text x="0" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a8899">between axes</text>
    <text x="52" y="-3" font-family="monospace" font-size="8" fill="#7a8899">x</text>
    <text x="2" y="-48" font-family="monospace" font-size="8" fill="#7a8899">y</text>
  </g>

  <!-- dxz -->
  <g transform="translate(180,135)">
    <ellipse cx="28" cy="-20" rx="30" ry="14" transform="rotate(35 28 -20)" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="-28" cy="20" rx="30" ry="14" transform="rotate(35 -28 20)" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="28" cy="20" rx="30" ry="14" transform="rotate(-35 28 20)" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <ellipse cx="-28" cy="-20" rx="30" ry="14" transform="rotate(-35 -28 -20)" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#252d3a" stroke-width="0.8"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#252d3a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#e8c060"/>
    <text x="0" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9070d0" font-style="italic">d</text>
    <text x="8" y="116" font-family="Georgia,serif" font-size="10" fill="#9070d0">xz</text>
    <text x="0" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a8899">xz plane</text>
  </g>

  <!-- dyz -->
  <g transform="translate(300,135)">
    <ellipse cx="20" cy="-28" rx="14" ry="30" transform="rotate(-20 20 -28)" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="-20" cy="28" rx="14" ry="30" transform="rotate(-20 -20 28)" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="20" cy="28" rx="14" ry="30" transform="rotate(20 20 28)" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <ellipse cx="-20" cy="-28" rx="14" ry="30" transform="rotate(20 -20 -28)" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#252d3a" stroke-width="0.8"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#252d3a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#e8c060"/>
    <text x="0" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9070d0" font-style="italic">d</text>
    <text x="8" y="116" font-family="Georgia,serif" font-size="10" fill="#9070d0">yz</text>
    <text x="0" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a8899">yz plane</text>
  </g>

  <!-- dx2-y2 — lobes on axes -->
  <g transform="translate(420,135)">
    <ellipse cx="40" cy="0" rx="38" ry="18" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="-40" cy="0" rx="38" ry="18" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="0" cy="40" rx="18" ry="38" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <ellipse cx="0" cy="-40" rx="18" ry="38" fill="url(#db)" stroke="#d4a843" stroke-width="1.2"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#252d3a" stroke-width="0.8"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#252d3a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#e8c060"/>
    <text x="0" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9070d0" font-style="italic">d</text>
    <text x="8" y="116" font-family="Georgia,serif" font-size="10" fill="#9070d0">x²-y²</text>
    <text x="0" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a8899">on x and y axes</text>
  </g>

  <!-- dz2 — 2 lobes + torus -->
  <g transform="translate(540,135)">
    <ellipse cx="0" cy="-42" rx="18" ry="38" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <ellipse cx="0" cy="42" rx="18" ry="38" fill="url(#da)" stroke="#9070d0" stroke-width="1.2"/>
    <!-- torus ring -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#d4a843" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="rgba(212,168,67,0.12)"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#252d3a" stroke-width="0.8"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#252d3a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#e8c060"/>
    <text x="0" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#9070d0" font-style="italic">d</text>
    <text x="8" y="116" font-family="Georgia,serif" font-size="10" fill="#9070d0">z²</text>
    <text x="0" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#7a8899">2 lobes + torus ring</text>
  </g>

  <text x="300" y="250" text-anchor="middle" font-family="monospace" font-size="9" fill="#4db87a">All 5 d-orbitals are degenerate (same energy) in absence of magnetic field</text>
</svg>
