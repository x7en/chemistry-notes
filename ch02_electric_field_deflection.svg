<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <rect width="500" height="280" fill="#0c0f14"/>
  <text x="250" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a8899" letter-spacing="0.3">EFFECT OF ELECTRIC FIELD ON FUNDAMENTAL PARTICLES</text>

  <!-- Positive plate (top) -->
  <rect x="80" y="35" width="320" height="18" rx="4" fill="rgba(217,95,95,0.15)" stroke="#d95f5f" stroke-width="1.5"/>
  <text x="240" y="49" text-anchor="middle" font-family="monospace" font-size="10" fill="#d95f5f">+ POSITIVE PLATE</text>
  <!-- field lines -->
  <line x1="120" y1="55" x2="120" y2="205" stroke="#303a4a" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="180" y1="55" x2="180" y2="205" stroke="#303a4a" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="240" y1="55" x2="240" y2="205" stroke="#303a4a" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="300" y1="55" x2="300" y2="205" stroke="#303a4a" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="360" y1="55" x2="360" y2="205" stroke="#303a4a" stroke-width="0.6" stroke-dasharray="4,4"/>

  <!-- Negative plate (bottom) -->
  <rect x="80" y="208" width="320" height="18" rx="4" fill="rgba(77,184,122,0.15)" stroke="#4db87a" stroke-width="1.5"/>
  <text x="240" y="222" text-anchor="middle" font-family="monospace" font-size="10" fill="#4db87a">− NEGATIVE PLATE</text>

  <!-- Entry label -->
  <text x="32" y="134" font-family="monospace" font-size="10" fill="#7a8899">→ beam</text>
  <text x="32" y="148" font-family="monospace" font-size="9" fill="#7a8899">enters</text>

  <!-- PROTON path — curves toward negative plate (down) -->
  <path d="M 75 130 Q 200 135 420 165" stroke="#d4a843" stroke-width="2.5" fill="none"/>
  <circle cx="420" cy="165" r="5" fill="#d4a843"/>
  <text x="430" y="162" font-family="monospace" font-size="11" fill="#d4a843">p</text>
  <text x="430" y="175" font-family="monospace" font-size="9" fill="#d4a843">→ −ve plate</text>
  <text x="430" y="186" font-family="monospace" font-size="9" fill="#7a8899">large radius</text>

  <!-- NEUTRON path — straight -->
  <line x1="75" y1="130" x2="420" y2="130" stroke="#7a8899" stroke-width="2.5"/>
  <circle cx="420" cy="130" r="5" fill="#7a8899"/>
  <text x="430" y="127" font-family="monospace" font-size="11" fill="#7a8899">n</text>
  <text x="430" y="140" font-family="monospace" font-size="9" fill="#7a8899">→ straight</text>
  <text x="430" y="151" font-family="monospace" font-size="9" fill="#7a8899">no deflect</text>

  <!-- ELECTRON path — curves sharply toward positive plate (up) -->
  <path d="M 75 130 Q 200 118 420 72" stroke="#3bbfb8" stroke-width="2.5" fill="none"/>
  <circle cx="420" cy="72" r="5" fill="#3bbfb8"/>
  <text x="430" y="69" font-family="monospace" font-size="11" fill="#3bbfb8">e⁻</text>
  <text x="430" y="82" font-family="monospace" font-size="9" fill="#3bbfb8">→ +ve plate</text>
  <text x="430" y="93" font-family="monospace" font-size="9" fill="#7a8899">small radius</text>

  <!-- Entry dot -->
  <circle cx="75" cy="130" r="5" fill="#e8c060"/>
  <text x="55" y="128" font-family="monospace" font-size="9" fill="#e8c060">entry</text>

  <!-- Legend bottom -->
  <rect x="60" y="242" width="380" height="30" rx="5" fill="rgba(255,255,255,0.02)" stroke="#252d3a" stroke-width="1"/>
  <line x1="75" y1="258" x2="105" y2="258" stroke="#3bbfb8" stroke-width="2"/>
  <text x="110" y="262" font-family="monospace" font-size="9" fill="#3bbfb8">Electron (most deflected)</text>
  <line x1="230" y1="258" x2="260" y2="258" stroke="#d4a843" stroke-width="2"/>
  <text x="265" y="262" font-family="monospace" font-size="9" fill="#d4a843">Proton</text>
  <line x1="330" y1="258" x2="360" y2="258" stroke="#7a8899" stroke-width="2"/>
  <text x="365" y="262" font-family="monospace" font-size="9" fill="#7a8899">Neutron (none)</text>

  <text x="250" y="278" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8c060">Angle ∝ charge/mass  ·  Radius ∝ mass/charge  ·  α-particle has largest radius of all</text>
</svg>
