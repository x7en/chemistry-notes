<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSc Chemistry XI — BISE Bahawalpur</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0c0f14;
  --bg2:    #131820;
  --bg3:    #1a2030;
  --line:   #252d3a;
  --line2:  #303a4a;
  --gold:   #d4a843;
  --gold2:  #e8c060;
  --teal:   #3bbfb8;
  --red:    #d95f5f;
  --green:  #4db87a;
  --blue:   #5a9fd4;
  --purple: #9070d0;
  --amber:  #e0853a;
  --text:   #dce4ef;
  --text2:  #7a8899;
  --text3:  #b8c4d4;
  --sans: 'Crimson Pro', Georgia, serif;
  --mono: 'JetBrains Mono', monospace;
  --display: 'Fraunces', Georgia, serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.75; min-height:100vh; }

/* ── LAYOUT ── */
.app { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
@media(max-width:768px){ .app { grid-template-columns:1fr; } }

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  overflow-y:auto; scrollbar-width:thin;
  scrollbar-color: var(--line2) transparent;
}
@media(max-width:768px){
  .sidebar { position:fixed; left:-260px; top:0; height:100%; width:260px; z-index:200; transition:left .3s ease; }
  .sidebar.open { left:0; box-shadow: 8px 0 40px rgba(0,0,0,0.6); }
}
.sidebar-head {
  padding:24px 20px 16px;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--bg2); z-index:1;
}
.sidebar-head .sh-tag {
  font-family:var(--mono); font-size:9px; letter-spacing:3px;
  color:var(--gold); text-transform:uppercase; margin-bottom:5px;
}
.sidebar-head .sh-title {
  font-family:var(--display); font-size:18px; color:#fff; line-height:1.2;
}
.sidebar-head .sh-sub {
  font-size:12px; color:var(--text2); margin-top:4px; font-family:var(--mono);
}
.ch-list { padding:12px 0; flex:1; }
.ch-group-label {
  font-family:var(--mono); font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--text2); padding:8px 20px 4px;
}
.ch-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 20px; cursor:pointer;
  transition:background .15s, color .15s;
  border-left:2px solid transparent;
  text-decoration:none;
}
.ch-item:hover { background:rgba(255,255,255,0.04); }
.ch-item.active { background:rgba(212,168,67,0.08); border-left-color:var(--gold); }
.ch-item .ch-num {
  font-family:var(--mono); font-size:10px; color:var(--gold);
  background:rgba(212,168,67,0.12); border-radius:3px;
  padding:1px 6px; flex-shrink:0;
}
.ch-item .ch-name { font-size:13px; color:var(--text3); line-height:1.3; }
.ch-item.active .ch-name { color:var(--text); }
.ch-item .ch-hot { font-size:9px; margin-left:auto; color:var(--gold); flex-shrink:0; }
.sidebar-footer {
  padding:14px 20px;
  border-top:1px solid var(--line);
  font-family:var(--mono); font-size:10px; color:var(--text2);
}

/* ── MAIN ── */
.main-area { overflow:hidden; }
.topbar {
  display:none;
  background:var(--bg2); border-bottom:1px solid var(--line);
  padding:12px 16px; align-items:center; gap:12px;
  position:sticky; top:0; z-index:100;
}
@media(max-width:768px){ .topbar { display:flex; } }
.menu-btn {
  background:none; border:1px solid var(--line2); border-radius:5px;
  color:var(--text2); padding:6px 10px; cursor:pointer; font-size:14px;
}
.topbar-title { font-family:var(--mono); font-size:12px; color:var(--gold); }
.overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
  z-index:150; backdrop-filter:blur(2px);
}
.overlay.show { display:block; }

#page { min-height:100vh; }

/* ── HOME PAGE ── */
.home-page { max-width:720px; margin:0 auto; padding:48px 24px 80px; }
.home-hero { text-align:center; margin-bottom:56px; }
.home-hero .h-eyebrow {
  font-family:var(--mono); font-size:10px; letter-spacing:3px;
  color:var(--gold); text-transform:uppercase; margin-bottom:12px;
}
.home-hero h1 {
  font-family:var(--display); font-size:clamp(28px,6vw,52px);
  font-weight:700; color:#fff; line-height:1.1; margin-bottom:14px;
}
.home-hero h1 em { font-style:italic; color:var(--gold); }
.home-hero p { color:var(--text2); font-size:15px; max-width:500px; margin:0 auto; }
.stats-row {
  display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
  margin-top:28px;
}
.stat-pill {
  background:rgba(255,255,255,0.04); border:1px solid var(--line2);
  border-radius:20px; padding:6px 16px;
  font-family:var(--mono); font-size:11px; color:var(--text2);
}
.stat-pill.hot { border-color:var(--gold); color:var(--gold); }
.ch-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:500px){ .ch-grid { grid-template-columns:1fr; } }
.ch-card {
  background:var(--bg2); border:1px solid var(--line);
  border-radius:10px; padding:18px; cursor:pointer;
  transition:border-color .2s, transform .15s;
  text-decoration:none; display:block;
}
.ch-card:hover { border-color:var(--gold); transform:translateY(-2px); }
.ch-card .cc-num {
  font-family:var(--mono); font-size:10px; color:var(--gold); margin-bottom:6px;
}
.ch-card .cc-title { font-size:15px; font-weight:600; color:var(--text); line-height:1.3; }
.ch-card .cc-meta { font-family:var(--mono); font-size:10px; color:var(--text2); margin-top:6px; }
.ch-card .cc-hot { color:var(--amber); }
.ch-card.deleted { opacity:.4; cursor:default; }
.ch-card.deleted:hover { border-color:var(--line); transform:none; }
.section-label {
  font-family:var(--mono); font-size:10px; letter-spacing:2px;
  text-transform:uppercase; color:var(--text2); margin:32px 0 12px;
}

/* ── CHAPTER PAGE ── */
.ch-page { max-width:820px; margin:0 auto; padding:36px 20px 80px; }
.ch-header {
  background:var(--bg2); border:1px solid var(--line);
  border-left:3px solid var(--gold); border-radius:8px;
  padding:24px 28px; margin-bottom:32px;
}
.ch-header .ch-tag {
  font-family:var(--mono); font-size:10px; letter-spacing:2px;
  color:var(--gold); text-transform:uppercase; margin-bottom:6px;
}
.ch-header h2 {
  font-family:var(--display); font-size:clamp(20px,4vw,32px);
  font-weight:700; color:#fff;
}
.ch-header .wt-badge {
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.3);
  border-radius:6px; padding:4px 12px;
  font-family:var(--mono); font-size:10px; color:var(--gold2);
}
.deleted-bar {
  background:rgba(217,95,95,0.08); border:1px solid rgba(217,95,95,0.3);
  border-radius:6px; padding:9px 14px; margin-top:10px;
  font-family:var(--mono); font-size:11px; color:var(--red);
}

/* ── SECTION ── */
.section { margin-bottom:44px; }
.section-title {
  display:flex; align-items:center; gap:10px;
  font-family:var(--display); font-size:20px; font-weight:700; color:var(--gold2);
  border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:18px;
}
.sec-num {
  font-family:var(--mono); font-size:11px;
  background:rgba(212,168,67,0.12); border:1px solid rgba(212,168,67,0.25);
  border-radius:3px; padding:2px 8px; color:var(--gold);
}
.subsec-title {
  font-family:var(--display); font-size:17px; font-weight:700;
  color:var(--teal); margin:22px 0 10px;
}

/* ── CONTENT BLOCKS ── */
p { color:var(--text3); margin-bottom:10px; font-size:15px; }
p strong { color:var(--text); }
ul,ol { padding-left:22px; margin:8px 0; }
li { color:var(--text3); font-size:14px; margin-bottom:5px; }
li strong { color:var(--text); }

.def-box {
  background:rgba(59,191,184,0.06); border:1px solid rgba(59,191,184,0.22);
  border-left:3px solid var(--teal); border-radius:6px; padding:14px 18px; margin:14px 0;
}
.def-box .dl { font-family:var(--mono); font-size:9px; color:var(--teal); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
.def-box .dt { color:var(--text3); font-style:italic; font-size:15px; }
.def-box .ds { font-family:var(--mono); font-size:10px; color:var(--text2); margin-top:5px; }

.concept-box {
  background:rgba(144,112,208,0.07); border:1px solid rgba(144,112,208,0.22);
  border-radius:8px; padding:16px 20px; margin:14px 0;
}
.concept-box .cl { font-family:var(--mono); font-size:10px; color:var(--purple); letter-spacing:1px; font-weight:600; margin-bottom:8px; }

.info-box {
  background:rgba(90,159,212,0.07); border:1px solid rgba(90,159,212,0.22);
  border-radius:8px; padding:14px 18px; margin:14px 0;
}
.info-box .il { font-family:var(--mono); font-size:9px; color:var(--blue); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }

.tip-box {
  background:rgba(212,168,67,0.06); border:1px solid rgba(212,168,67,0.25);
  border-left:3px solid var(--gold2); border-radius:6px; padding:12px 16px; margin:14px 0;
}
.tip-box .tl { font-family:var(--mono); font-size:9px; color:var(--gold2); letter-spacing:2px; text-transform:uppercase; margin-bottom:5px; }

.error-box {
  background:rgba(217,95,95,0.06); border:1px solid rgba(217,95,95,0.28);
  border-radius:8px; padding:14px 18px; margin:14px 0;
}
.error-box .el { font-family:var(--mono); font-size:10px; color:var(--red); letter-spacing:1px; font-weight:600; margin-bottom:8px; }
.error-box .ew { color:var(--red); font-size:13.5px; margin:4px 0; }
.error-box .ec { color:var(--green); font-size:13.5px; margin:4px 0; }
.error-box .er { color:var(--text2); font-size:12.5px; margin-top:6px; }

.eq-block {
  background:var(--bg3); border:1px solid var(--line2);
  border-radius:6px; padding:12px 16px; margin:10px 0;
  font-family:var(--mono); font-size:12.5px; color:var(--text3);
  overflow-x:auto; white-space:pre;
}

.table-wrap { overflow-x:auto; margin:14px 0; border-radius:8px; border:1px solid var(--line); }
table { width:100%; border-collapse:collapse; }
th {
  background:var(--bg3); color:var(--gold2);
  font-family:var(--mono); font-size:10px; letter-spacing:1px;
  text-align:left; padding:9px 12px; border-bottom:1px solid var(--line);
}
td {
  padding:8px 12px; font-size:13px; color:var(--text3);
  border-bottom:1px solid rgba(37,45,58,0.6);
}
tr:last-child td { border-bottom:none; }
tr:nth-child(even) td { background:rgba(255,255,255,0.015); }

.factor-list { list-style:none; padding:0; margin:10px 0; }
.factor-list li {
  padding:7px 12px 7px 38px; position:relative;
  border-left:2px solid var(--line); margin-bottom:5px;
  background:rgba(255,255,255,0.015); border-radius:0 5px 5px 0; font-size:13.5px;
}
.factor-list li .fn {
  position:absolute; left:8px; top:7px;
  font-family:var(--mono); font-size:10px; color:var(--gold); font-weight:600;
}
.factor-list li strong { color:var(--gold2); display:block; margin-bottom:2px; }

.trend-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0; }
@media(max-width:560px){ .trend-grid { grid-template-columns:1fr; } }
.trend-card {
  background:var(--bg3); border:1px solid var(--line2); border-radius:8px; padding:14px;
}
.trend-card .tc-p { font-family:var(--mono); font-size:10px; color:var(--gold); margin-bottom:8px; }
.trend-card .tc-a { color:var(--teal); font-size:13px; }
.trend-card .tc-d { color:var(--amber); font-size:13px; margin-top:4px; }

.rxn-box { background:var(--bg3); border:1px solid var(--line2); border-radius:8px; padding:14px 18px; margin:12px 0; }
.rxn-box .rh { font-family:var(--mono); font-size:10px; color:var(--amber); letter-spacing:1px; margin-bottom:8px; }
.rxn { font-family:var(--mono); font-size:12px; color:var(--text3); margin:4px 0; padding:3px 0; border-bottom:1px dashed rgba(37,45,58,0.8); }
.rxn:last-child { border-bottom:none; }
.rxn .rn { font-size:11px; color:var(--text2); margin-left:8px; }

.orbital-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
@media(max-width:480px){ .orbital-grid { grid-template-columns:1fr; } }
.orb-card { background:var(--bg3); border:1px solid var(--line2); border-radius:8px; padding:14px; text-align:center; }
.orb-card .os { font-family:var(--display); font-size:28px; font-style:italic; color:var(--gold); margin-bottom:3px; }
.orb-card .osh { font-size:12px; color:var(--teal); margin-bottom:5px; }

.qn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
@media(max-width:540px){ .qn-grid { grid-template-columns:1fr; } }
.qn-card { background:var(--bg3); border:1px solid var(--line2); border-top:2px solid var(--purple); border-radius:8px; padding:13px; }
.qn-card .qn { font-family:var(--mono); font-size:11px; color:var(--purple); font-weight:600; margin-bottom:5px; }
.qn-card .qs { color:var(--gold2); font-weight:700; }
.qn-card .qv { font-family:var(--mono); font-size:11px; color:var(--teal); margin-top:4px; }

.note-tag {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(59,191,184,0.08); border:1px solid rgba(59,191,184,0.2);
  border-radius:4px; padding:2px 10px;
  font-family:var(--mono); font-size:9px; color:var(--teal);
  margin-bottom:6px;
}

/* ── MCQ SECTION ── */
.mcq-section h3 {
  font-family:var(--display); font-size:19px; color:var(--amber);
  border-bottom:1px solid var(--line); padding-bottom:8px; margin:32px 0 18px;
}
.mcq-item {
  background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; padding:15px 17px; margin-bottom:14px;
  transition:border-color .2s;
}
.mcq-item:hover { border-color:var(--amber); }
.mcq-q { font-size:14px; font-weight:600; color:var(--text); margin-bottom:11px; }
.mcq-q .qn { font-family:var(--mono); color:var(--amber); margin-right:6px; }
.mcq-opts { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
@media(max-width:480px){ .mcq-opts { grid-template-columns:1fr; } }
.opt {
  padding:6px 11px; border-radius:5px; font-size:13px;
  border:1px solid var(--line); color:var(--text2); cursor:default;
}
.opt .ol { font-family:var(--mono); font-size:10px; margin-right:5px; }
.opt.correct { background:rgba(77,184,122,0.1); border-color:var(--green); color:var(--green); font-weight:600; }
.mcq-exp {
  margin-top:9px; padding-top:9px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--text2);
}
.mcq-exp strong { color:var(--green); }

/* ── SHORT Q SECTION ── */
.sq-section h3 {
  font-family:var(--display); font-size:19px; color:var(--teal);
  border-bottom:1px solid var(--line); padding-bottom:8px; margin:32px 0 18px;
}
.sq-item { background:var(--bg2); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; overflow:hidden; }
.sq-q {
  padding:12px 16px; font-size:14px; font-weight:600; color:var(--text);
  cursor:pointer; display:flex; align-items:flex-start; gap:10px;
  border-bottom:1px solid transparent; transition:background .15s;
}
.sq-q:hover { background:rgba(255,255,255,0.025); }
.sq-q.open { border-bottom-color:var(--line); }
.sq-qnum {
  font-family:var(--mono); font-size:10px; color:var(--teal);
  background:rgba(59,191,184,0.1); border-radius:3px;
  padding:1px 7px; flex-shrink:0; margin-top:2px;
}
.sq-tog { margin-left:auto; color:var(--text2); flex-shrink:0; transition:transform .2s; font-size:14px; }
.sq-q.open .sq-tog { transform:rotate(180deg); }
.sq-ans { display:none; padding:13px 16px; font-size:13.5px; color:var(--text3); line-height:1.7; }
.sq-ans.show { display:block; }
.sq-ans .btag { font-family:var(--mono); font-size:9px; color:var(--amber); letter-spacing:1px; margin-bottom:6px; }

/* ── LONG Q SECTION ── */
.lq-section h3 {
  font-family:var(--display); font-size:19px; color:var(--purple);
  border-bottom:1px solid var(--line); padding-bottom:8px; margin:32px 0 18px;
}
.lq-item {
  background:var(--bg2); border:1px solid var(--line);
  border-left:3px solid var(--purple); border-radius:8px;
  padding:16px 18px; margin-bottom:14px;
}
.lq-title { font-family:var(--mono); font-size:11px; color:var(--purple); margin-bottom:6px; }
.lq-q { font-size:14.5px; font-weight:600; color:var(--text); margin-bottom:12px; }
.lq-part-label { font-family:var(--mono); font-size:10px; color:var(--gold); letter-spacing:1px; margin:12px 0 5px; }
.lq-pts { list-style:none; padding:0; }
.lq-pts li { padding:3px 0 3px 18px; position:relative; font-size:13.5px; color:var(--text3); }
.lq-pts li::before { content:'▹'; position:absolute; left:0; color:var(--purple); }
.marks-badge {
  display:inline-block; background:rgba(144,112,208,0.12);
  border:1px solid rgba(144,112,208,0.25); border-radius:10px;
  padding:1px 9px; font-family:var(--mono); font-size:9px;
  color:var(--purple); margin-left:8px;
}

/* ── CHAPTER DIVIDER ── */
.ch-divider { height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:44px 0 36px; border:none; }

/* ── SCROLL TOP ── */
#scroll-top {
  position:fixed; bottom:22px; right:18px;
  background:var(--gold); color:#000; border:none; border-radius:50%;
  width:38px; height:38px; font-size:16px; cursor:pointer;
  display:none; align-items:center; justify-content:center;
  box-shadow:0 4px 18px rgba(212,168,67,0.35); z-index:300;
}
#scroll-top.show { display:flex; }

/* ── LOADING ── */
.loading { text-align:center; padding:80px 20px; color:var(--text2); font-family:var(--mono); font-size:13px; }
.loading::after { content:''; display:inline-block; width:8px; height:8px; background:var(--gold); border-radius:50%; margin-left:8px; animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

.error-page { text-align:center; padding:80px 20px; color:var(--text2); }
.error-page h3 { font-family:var(--display); color:var(--red); margin-bottom:8px; }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sh-tag">Smart Syllabus</div>
      <div class="sh-title">FSc Chemistry XI</div>
      <div class="sh-sub">BISE Bahawalpur · 85 Marks</div>
    </div>
    <nav class="ch-list" id="ch-list">
      <div class="loading">Loading chapters</div>
    </nav>
    <div class="sidebar-footer">
      14 chapters · 17 MCQs · 3 Long Qs
    </div>
  </aside>

  <!-- MOBILE OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div class="main-area">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span class="topbar-title" id="topbar-title">FSc Chemistry XI</span>
    </div>
    <div id="page">
      <div class="loading">Loading</div>
    </div>
  </div>

</div>

<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ─── STATE ────────────────────────────────────────────────
let manifest = [];
let currentChapter = null;

// ─── INIT ─────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch('chapters/manifest.json');
    manifest = await res.json();
    renderSidebar();
    router();
    window.addEventListener('hashchange', router);
  } catch(e) {
    document.getElementById('page').innerHTML = `<div class="error-page"><h3>Could not load manifest.json</h3><p>Make sure chapters/manifest.json exists in your repo.</p></div>`;
  }
}

// ─── ROUTER ───────────────────────────────────────────────
function router() {
  const hash = location.hash.replace('#','');
  if (!hash || hash === 'home') {
    renderHome();
  } else {
    const ch = manifest.find(c => c.id === hash);
    if (ch) loadChapter(ch);
    else renderHome();
  }
}

// ─── SIDEBAR ──────────────────────────────────────────────
function renderSidebar() {
  const nav = document.getElementById('ch-list');
  const retained = manifest.filter(c => !c.deleted);
  const deleted  = manifest.filter(c => c.deleted);

  let html = `<div class="ch-group-label">Retained Chapters</div>`;
  retained.forEach(ch => {
    html += `<a class="ch-item ${ch.hot?'hot':''}" href="#${ch.id}" onclick="closeSidebar()">
      <span class="ch-num">${ch.num}</span>
      <span class="ch-name">${ch.short_title}</span>
      ${ch.hot ? '<span class="ch-hot">★★</span>' : ''}
    </a>`;
  });
  html += `<div class="ch-group-label" style="margin-top:8px;">Deleted (Ch 15–16)</div>`;
  deleted.forEach(ch => {
    html += `<a class="ch-item" style="opacity:.35;pointer-events:none;" href="#">
      <span class="ch-num" style="color:var(--text2)">${ch.num}</span>
      <span class="ch-name" style="text-decoration:line-through">${ch.short_title}</span>
    </a>`;
  });
  nav.innerHTML = html;
}

function updateActiveNav(id) {
  document.querySelectorAll('.ch-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('href') === '#'+id);
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ─── HOME PAGE ────────────────────────────────────────────
function renderHome() {
  currentChapter = null;
  document.title = 'FSc Chemistry XI — BISE Bahawalpur';
  document.getElementById('topbar-title').textContent = 'Home';
  updateActiveNav('');

  const retained = manifest.filter(c => !c.deleted);
  let cards = retained.map(ch => `
    <a class="ch-card ${ch.status==='coming'?'deleted':''}" href="#${ch.id}">
      <div class="cc-num">Chapter ${ch.num}</div>
      <div class="cc-title">${ch.title}</div>
      <div class="cc-meta ${ch.hot?'cc-hot':''}">
        ${ch.hot?'★ ':''}${ch.exam_line || ''}
        ${ch.status==='coming'?'<span style="color:var(--text2)"> · Coming soon</span>':''}
      </div>
    </a>`).join('');

  const stats = [
    {t:'17 MCQs', hot:false},
    {t:'2 MCQs from Ch 1, 6, 10', hot:true},
    {t:'5 Long Questions', hot:false},
    {t:'85 Total Marks', hot:false},
    {t:'Q2/Q3/Q4 Short Qs', hot:false},
  ];

  document.getElementById('page').innerHTML = `
    <div class="home-page">
      <div class="home-hero">
        <div class="h-eyebrow">BISE Bahawalpur · Smart Syllabus</div>
        <h1>FSc Chemistry <em>XI</em></h1>
        <p>Chapters 1–14 · Board-style MCQs, Short Questions, Long Questions, Concept Builders, Book Error Flags</p>
        <div class="stats-row">
          ${stats.map(s=>`<span class="stat-pill ${s.hot?'hot':''}">${s.t}</span>`).join('')}
        </div>
      </div>
      <div class="section-label">Retained Chapters</div>
      <div class="ch-grid">${cards}</div>
    </div>`;
}

// ─── LOAD CHAPTER ─────────────────────────────────────────
async function loadChapter(chMeta) {
  document.getElementById('page').innerHTML = '<div class="loading">Loading chapter</div>';
  updateActiveNav(chMeta.id);
  document.getElementById('topbar-title').textContent = `Ch ${chMeta.num}`;

  if (chMeta.status === 'coming') {
    document.getElementById('page').innerHTML = `<div class="error-page"><h3>Coming Soon</h3><p>Chapter ${chMeta.num} notes are being prepared.</p></div>`;
    return;
  }

  try {
    const res = await fetch(`chapters/${chMeta.id}.json`);
    if (!res.ok) throw new Error('404');
    const data = await res.json();
    currentChapter = data;
    document.title = `Ch ${chMeta.num} · ${data.meta.title}`;
    document.getElementById('page').innerHTML = renderChapter(data);
    setupInteractivity();
    window.scrollTo(0,0);
  } catch(e) {
    document.getElementById('page').innerHTML = `<div class="error-page"><h3>Chapter not yet available</h3><p>chapters/${chMeta.id}.json not found.</p></div>`;
  }
}

// ─── CHAPTER RENDERER ─────────────────────────────────────
function renderChapter(data) {
  const m = data.meta;
  let html = `<div class="ch-page">`;

  // Header
  html += `<div class="ch-header">
    <div class="ch-tag">Chapter ${m.number.toString().padStart(2,'0')}</div>
    <h2>${m.title}</h2>
    <div class="wt-badge">🎯 ${m.exam_info}</div>
    ${m.deleted ? `<div class="deleted-bar">🗑 DELETED: ${m.deleted}</div>` : ''}
    ${m.notes_merged ? `<div style="background:rgba(59,191,184,0.07);border:1px solid rgba(59,191,184,0.2);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:10px;color:var(--teal);margin-top:8px;">✎ ${m.notes_merged}</div>` : ''}
  </div>`;

  // Sections
  if (data.sections) {
    data.sections.forEach(sec => {
      html += renderSection(sec);
    });
  }

  // MCQs
  if (data.mcqs && data.mcqs.length) {
    html += `<div class="mcq-section"><h3>MCQs — ${m.title}</h3>`;
    data.mcqs.forEach((q,i) => { html += renderMCQ(q, i); });
    html += `</div>`;
  }

  // Short Questions
  if (data.sqs && data.sqs.length) {
    html += `<div class="sq-section"><h3>Short Questions</h3>`;
    data.sqs.forEach((q,i) => { html += renderSQ(q, i); });
    html += `</div>`;
  }

  // Long Questions
  if (data.lqs && data.lqs.length) {
    html += `<div class="lq-section"><h3>Long Questions</h3>`;
    data.lqs.forEach(q => { html += renderLQ(q); });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

// ─── SECTION RENDERER ─────────────────────────────────────
function renderSection(sec) {
  let html = `<div class="section" id="${sec.id || ''}">`;
  html += `<div class="section-title"><span class="sec-num">${sec.number}</span>${sec.title}</div>`;
  if (sec.blocks) sec.blocks.forEach(b => { html += renderBlock(b); });
  html += `</div>`;
  return html;
}

// ─── BLOCK RENDERER ───────────────────────────────────────
function renderBlock(b) {
  switch(b.type) {

    case 'p':
      return `<p>${b.t}</p>`;

    case 'subsec':
      return `<div class="subsec-title">${b.t}</div>`;

    case 'note':
      return `<div class="note-tag">✎ From Notes: ${b.t}</div>`;

    case 'deleted':
      return `<div class="deleted-bar">${b.t}</div>`;

    case 'def':
      return `<div class="def-box">
        <div class="dl">${b.label || 'Definition'}</div>
        <div class="dt">"${b.text}"</div>
        ${b.src ? `<div class="ds">📖 ${b.src}</div>` : ''}
      </div>`;

    case 'concept':
      return `<div class="concept-box">
        <div class="cl">🧠 CONCEPT BUILD — ${b.head}</div>
        ${b.body ? `<p>${b.body}</p>` : ''}
        ${b.items ? `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>` : ''}
        ${b.eq ? `<div class="eq-block">${b.eq}</div>` : ''}
        ${b.note ? `<p style="margin-top:8px;">${b.note}</p>` : ''}
      </div>`;

    case 'info':
      return `<div class="info-box">
        <div class="il">📌 ${b.head || 'Info'}</div>
        ${b.body ? `<p>${b.body}</p>` : ''}
        ${b.items ? `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>` : ''}
      </div>`;

    case 'tip':
      return `<div class="tip-box">
        <div class="tl">⚡ Exam Tip — BISE Bahawalpur</div>
        <p>${b.t}</p>
      </div>`;

    case 'error':
      return `<div class="error-box">
        <div class="el">⚠️ ${b.head || 'BOOK ERROR DETECTED'}</div>
        <div class="ew">❌ ${b.wrong}</div>
        <div class="ec">✅ ${b.correct}</div>
        <div class="er">📌 ${b.reason}</div>
      </div>`;

    case 'eq':
      return `<div class="eq-block">${b.t}</div>`;

    case 'table':
      let thtml = `<div class="table-wrap"><table>
        <tr>${b.cols.map(c=>`<th>${c}</th>`).join('')}</tr>
        ${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
      </table></div>`;
      return thtml;

    case 'ul':
      return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;

    case 'ol':
      return `<ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;

    case 'factors':
      return `<ul class="factor-list">${b.items.map((f,i)=>`
        <li><span class="fn">${f.num||i+1}</span><strong>${f.title}</strong>${f.body}</li>`).join('')}
      </ul>`;

    case 'trends':
      return `<div class="trend-grid">${b.cards.map(c=>`
        <div class="trend-card">
          <div class="tc-p">${c.prop}</div>
          ${c.across ? `<div class="tc-a">→ ${c.across}</div>` : ''}
          ${c.across_note ? `<div style="font-size:11px;color:var(--text2);margin:3px 0;">${c.across_note}</div>` : ''}
          ${c.down ? `<div class="tc-d">↓ ${c.down}</div>` : ''}
          ${c.down_note ? `<div style="font-size:11px;color:var(--text2);margin-top:3px;">${c.down_note}</div>` : ''}
          ${c.body ? `<div style="font-size:12.5px;color:var(--text3);line-height:1.7;margin-top:6px;">${c.body}</div>` : ''}
        </div>`).join('')}
      </div>`;

    case 'reactions':
      return `<div class="rxn-box">
        <div class="rh">${b.head}</div>
        ${b.rxns.map(r=>`<div class="rxn">${r.eq}${r.note?`<span class="rn">← ${r.note}</span>`:''}</div>`).join('')}
      </div>`;

    case 'orbitals':
      return `<div class="orbital-grid">${b.items.map(o=>`
        <div class="orb-card">
          <div class="os">${o.sym}</div>
          <div class="osh">${o.shape}</div>
          <p>${o.body}</p>
        </div>`).join('')}
      </div>`;

    case 'qn-grid':
      return `<div class="qn-grid">${b.items.map(q=>`
        <div class="qn-card">
          <div class="qn">${q.name}</div>
          <div class="qs">${q.sym}</div>
          <p>${q.body}</p>
          <div class="qv">${q.vals}</div>
          ${q.note?`<p style="font-size:11.5px;margin-top:5px;">${q.note}</p>`:''}
        </div>`).join('')}
      </div>`;

    default:
      return '';
  }
}

// ─── MCQ RENDERER ─────────────────────────────────────────
function renderMCQ(q, i) {
  const letters = ['A','B','C','D'];
  return `<div class="mcq-item">
    <div class="mcq-q"><span class="qn">${q.num||'Q'+(i+1)}</span>${q.src?`(${q.src}) `:''} ${q.q}</div>
    <div class="mcq-opts">
      ${q.opts.map((o,j)=>`<div class="opt ${j===q.ans?'correct':''}">
        <span class="ol">${letters[j]}.</span>${o}
      </div>`).join('')}
    </div>
    ${q.exp ? `<div class="mcq-exp"><strong>Answer: ${letters[q.ans]}</strong> — ${q.exp}</div>` : ''}
  </div>`;
}

// ─── SHORT Q RENDERER ─────────────────────────────────────
function renderSQ(q, i) {
  return `<div class="sq-item">
    <div class="sq-q" onclick="toggleSQ(this)">
      <span class="sq-qnum">${q.num||'Q'+(i+1)}</span>
      ${q.q}
      <span class="sq-tog">▾</span>
    </div>
    <div class="sq-ans">
      <div class="btag">${q.tag||'BOARD STYLE ANSWER'}</div>
      ${q.a}
    </div>
  </div>`;
}

// ─── LONG Q RENDERER ──────────────────────────────────────
function renderLQ(q) {
  return `<div class="lq-item">
    <div class="lq-title">${q.title||''} ${q.marks?`<span class="marks-badge">${q.marks}</span>`:''}</div>
    <div class="lq-q">${q.q}</div>
    ${(q.parts||[]).map(p=>`
      <div class="lq-part-label">${p.label}</div>
      <ul class="lq-pts">${p.points.map(pt=>`<li>${pt}</li>`).join('')}</ul>
    `).join('')}
  </div>`;
}

// ─── INTERACTIVITY ────────────────────────────────────────
function setupInteractivity() {
  // scroll-to-top
  window.removeEventListener('scroll', scrollHandler);
  window.addEventListener('scroll', scrollHandler);
}
function scrollHandler() {
  const btn = document.getElementById('scroll-top');
  btn.classList.toggle('show', window.scrollY > 400);
}
function toggleSQ(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

// ─── RUN ──────────────────────────────────────────────────
init();
</script>
